---

# jenkins variables
project_name: docker-webstation
external_type: os
release_type: prerelease
release_tag: romm
ls_branch: romm
build_armhf: false
repo_vars:
  - BUILD_VERSION_ARG = 'OS_VERSION'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-webstation'
  - CONTAINER_NAME = 'webstation'
  - DOCKERHUB_IMAGE = 'linuxserver/webstation'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/webstation'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/webstation'
  - DIST_IMAGE = 'ubuntu'
  - MULTIARCH='false'
  - CI='true'
  - CI_WEB='true'
  - CI_PORT='3001'
  - CI_SSL='true'
  - CI_DELAY='120'
  - CI_DOCKERENV='TZ=US/Pacific'
  - CI_AUTH='user:password'
  - CI_WEBPATH=''
